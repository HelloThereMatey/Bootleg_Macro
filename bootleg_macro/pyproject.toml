[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bootleg-macro"
version = "0.1.0"
description = "Financial & economic data analysis toolkit — charting, watchlists, custom indexes, and desktop GUI"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "bootleg-datafeed>=0.1",
    # toolz/ imports these but they were never declared, so a clean
    # `import bootleg_macro` failed on plotly, then statsmodels, then scipy
    "plotly>=5.0",
    # charting.save_png() exports figures via plotly image export,
    # which raises "Image export requires the Kaleido package"
    # without this. Charts are a headline feature, so it is required.
    "kaleido>=1.0",
    "statsmodels>=0.14",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.0",
]
all = ["bootleg-macro[gui]"]

# Flat layout — pyproject.toml sits inside the package itself, so
# `packages.find` could never match (empty wheel, editable install mapping
# nothing). Map the package root onto "." and each subpackage onto its dir.
[tool.setuptools]
packages = [
    "bootleg_macro",
    "bootleg_macro.indexes",
    "bootleg_macro.indexes.tests",
    "bootleg_macro.toolz",
    "bootleg_macro.toolz.tests",
    "bootleg_macro.watchlist_gui",
    "bootleg_macro.watchlist_gui.gui",
    "bootleg_macro.watchlist_gui.tests",
]

# Global_M2 reads its country/FX mapping from xlsx files that live next to the
# source. Without this a wheel ships the code but not the config, so the class
# constructor fails with "Config file not found".
[tool.setuptools.package-data]
"bootleg_macro.indexes" = ["UpdateM2Infos/*.xlsx"]

[tool.setuptools.package-dir]
"bootleg_macro" = "."
"bootleg_macro.indexes" = "indexes"
"bootleg_macro.indexes.tests" = "indexes/tests"
"bootleg_macro.toolz" = "toolz"
"bootleg_macro.toolz.tests" = "toolz/tests"
"bootleg_macro.watchlist_gui" = "watchlist_gui"
"bootleg_macro.watchlist_gui.gui" = "watchlist_gui/gui"
"bootleg_macro.watchlist_gui.tests" = "watchlist_gui/tests"
