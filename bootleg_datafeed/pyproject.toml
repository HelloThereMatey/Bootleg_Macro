[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bootleg-datafeed"
version = "0.1.0"
description = "Core data acquisition module — pull financial/economic time series from 11+ sources"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "requests>=2.0",
    "pydantic>=2.0",
    "yfinance>=0.1",
    "numpy>=1.0",
    "readabs>=0.1",
    # RBA serves legacy .xls workbooks for many tables; pandas needs a reader
    # for them or pull_rba dies with "Import python-calamine failed".
    "python-calamine>=0.1",
    "openpyxl>=3.1",
    "nasdaq-data-link>=0.1",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
chrome = ["selenium"]
all = ["selenium"]

# This project is flat-layout: pyproject.toml lives *inside* the package, so
# `packages.find` looked for a bootleg_datafeed/ subdirectory that does not
# exist (empty 1.2 KB wheel, and an editable install that mapped nothing).
# Map the package root onto "." and each subpackage onto its real directory.
[tool.setuptools]
packages = [
    "bootleg_datafeed",
    "bootleg_datafeed.sources",
    "bootleg_datafeed.sources.abs_source",
    "bootleg_datafeed.sources.abs_source.extend_history",
    "bootleg_datafeed.sources.tvDatafeedz",
    "bootleg_datafeed.tests",
]

[tool.setuptools.package-dir]
"bootleg_datafeed" = "."
"bootleg_datafeed.sources" = "sources"
"bootleg_datafeed.sources.abs_source" = "sources/abs_source"
"bootleg_datafeed.sources.abs_source.extend_history" = "sources/abs_source/extend_history"
"bootleg_datafeed.sources.tvDatafeedz" = "sources/tvDatafeedz"
"bootleg_datafeed.tests" = "tests"
